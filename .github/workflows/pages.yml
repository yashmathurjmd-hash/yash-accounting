name: Deploy YASH Accounting V50

on:
  push:
    branches: [main]
    paths:
      - 'YASH_Accounting_V50_Voucher_Polish.zip'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V50
        uses: actions/checkout@v4

      - name: Extract V50 build
        run: |
          rm -rf v50-site
          mkdir v50-site
          unzip -q YASH_Accounting_V50_Voucher_Polish.zip -d v50-site
          test -f v50-site/index.html

      - name: Upload V50 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v50-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy V50 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
